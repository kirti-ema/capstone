version: 1

indices:
  # Magazine articles (US). Feeds the dynamic cards-teaser listing used by
  # "Recent Articles" (homepage) and "All Articles" (magazine). Locked
  # "Members Only" articles are excluded so they never surface in public lists.
  # Add a matching /ca/en/magazine index with the same shape when CA is in scope.
  magazine:
    include:
      - '/us/en/magazine/**'
    exclude:
      # the magazine landing page itself (it would otherwise appear as a card in
      # its own "All Articles" list and in homepage "Recent Articles")
      - '/us/en/magazine'
      # locked "Members Only" articles must never surface in public lists
      - '/us/en/magazine/members-only/**'
    target: /us/en/magazine/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      # og:image is an absolute URL; store just the path so it resolves in any
      # environment (preview, live, local). createOptimizedPicture uses the
      # pathname anyway.
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      # Curated listing position, authored per article via a "Card Order"
      # metadata field (renders as <meta name="card-order">). A number means
      # "show at this position" (ascending); blank means "not shown" in curated
      # listings. Lets authors control selection + order instead of recency.
      cardOrder:
        select: head > meta[name="card-order"]
        value: |
          attribute(el, 'content')
      # Dedicated card thumbnail, authored as a plain-text image path in a
      # "Card Image" metadata field (renders as <meta name="card-image">).
      # MUST be authored as TEXT, not an <img> — an <img> in a metadata cell
      # fails to resolve (emits about:error and corrupts og:image). When set,
      # the listing card uses this instead of the article's hero (og:image).
      cardImage:
        select: head > meta[name="card-image"]
        value: |
          attribute(el, 'content')
      # Editorial publish date, authored per article via a "Publish Date"
      # metadata field (renders as <meta name="publish-date">), stored as the
      # human string the source shows (e.g. "Thursday, 9 Jul 2020"). The
      # "SHARE THIS STORY" related-articles list renders it as the date line
      # under each title, matching the source's dated sidebar.
      publishDate:
        select: head > meta[name="publish-date"]
        value: |
          attribute(el, 'content')

  # Adventures (US). Same shape as the magazine index so every dynamic block
  # reads a feed the same way (scripts/query-index.js). Feeds the homepage
  # "Next Adventures" listing and the Adventures page's category-filtered tabs.
  # Adds a `category` field the tabs group by. Add a matching /ca/en/adventures
  # index with the same shape when CA is in scope.
  adventures:
    include:
      - '/us/en/adventures/**'
    exclude:
      # the adventures landing page itself (it would otherwise appear as a card
      # in its own listing)
      - '/us/en/adventures'
    target: /us/en/adventures/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      # og:image is an absolute URL; store just the path so it resolves in any
      # environment (preview, live, local).
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      # Curated listing position (see magazine index above).
      cardOrder:
        select: head > meta[name="card-order"]
        value: |
          attribute(el, 'content')
      # Dedicated card thumbnail, authored as a plain-text image path (see
      # magazine index above). MUST be authored as TEXT, not an <img>.
      cardImage:
        select: head > meta[name="card-image"]
        value: |
          attribute(el, 'content')
      # Adventure category, authored per page via a "Category" metadata field
      # (renders as <meta name="category">). The Adventures page's tabs-filter
      # groups adventures by this value.
      category:
        select: head > meta[name="category"]
        value: |
          attribute(el, 'content')
      # Marks the single adventure shown in the homepage "Next Adventures"
      # featured banner, authored per page via a "Featured" metadata field
      # (renders as <meta name="featured">). Set to "true" on exactly one
      # adventure; the dynamic hero-banner selects it (lowest cardOrder wins if
      # more than one is marked).
      featured:
        select: head > meta[name="featured"]
        value: |
          attribute(el, 'content')
